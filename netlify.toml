# VIVA Eventos · configuração de deploy no Netlify

[build]
  # Site estático: nada para compilar.
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ------------------------------------------------------------------
# Landings das unidades
# Elas vivem noutro projeto do Netlify (repositorio vivaeventosjf/belo-horizonte),
# porque um dominio so pode pertencer a um projeto. Com status 200 o conteudo
# e servido aqui mesmo: a URL continua franquia.vivaeventos.com.br/belo-horizonte.
#
# Estas linhas sao geradas por ferramentas/netlify.js naquele repositorio
# (arquivo regras-para-o-site-da-franquia.txt). Ao entrar uma unidade nova,
# acrescente a regra dela aqui, senao ela responde 404.
#
# Uma regra por unidade, so com /*. Nao acrescente uma regra 301 de
# "/unidade" para "/unidade/": o Netlify normaliza a barra final, a regra
# casa com ela mesma e a pagina entra em loop de redirecionamento.
# ------------------------------------------------------------------
[[redirects]]
  from = "/belo-horizonte/*"
  to = "https://belo-horizonte.netlify.app/belo-horizonte/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/aracaju/*"
  to = "https://belo-horizonte.netlify.app/aracaju/:splat"
  status = 200
  force = true

# ------------------------------------------------------------------
# Cache
# Imagens, fontes e o favicon nunca mudam de conteúdo sem mudar de nome,
# então podem ficar um ano no navegador.
# ------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS e JS são versionados na query (?v=18), então também podem durar.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML precisa ser sempre conferido, senão uma alteração nunca chega.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------------
# Relatorios
# Documento interno servido por link direto. Nao entra em buscador
# (X-Robots-Tag, alem da meta tag na propria pagina) e nao pode ficar
# congelado no cache: o CSS dele nao e versionado por query, entao a
# regra geral de /*.css valeria um ano e uma correcao nunca chegaria.
# ------------------------------------------------------------------
[[headers]]
  for = "/relatorio-05-09-a-24-09-2026/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ------------------------------------------------------------------
# Relatorio de midia ao vivo
# A pagina /relatorio le a function relatorio-dados, que cruza a API da
# Meta com o CRM Kommo. A coleta agendada roda de madrugada e deixa o
# cache pronto, entao quem abre a pagina nao espera pelas duas APIs.
#
# Precisa destas variaveis em Site configuration > Environment variables:
#   META_TOKEN          token com permissao ads_read
#   META_AD_ACCOUNT_ID  id da conta de anuncios
#   KOMMO_SUBDOMAIN     ja configurada, usada pela function kommo
#   KOMMO_TOKEN         ja configurada, usada pela function kommo
# ------------------------------------------------------------------
[functions."relatorio-coleta"]
  schedule = "0 8 * * *"

[[headers]]
  for = "/relatorio/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
